name: Endor Remediation PR (no GitHub App)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # keyless Endor auth
      contents: write        # push the remediation branch
      pull-requests: write   # open the remediation PR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Endor Labs Scan
        uses: endorlabs/github-action@main
        env:
          # Takes precedence over any GitHub App installation token.
          ENDOR_SCAN_SCM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENDOR_SCAN_REMEDIATION_ACTION: "true"
          ENDOR_SCAN_RESCAN_CODE: "true"
        with:
          namespace: "endor-solutions-tsaekao.github"
          api: "https://api.endorlabs.com"
          pr: false
          enable_github_action_token: true
          scan_dependencies: true
          additional_args: "--use-bazel --as-default-branch"
